services:
  - type: web
    name: mi-plan-estudio
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: ./data
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
